name: Test build

# Builds a test DMG + zip and attaches them to the run as downloadable artifacts. Nothing is published to
# Releases. Triggers: a push to any branch except main, or manually (the manual button only appears once this
# file is on the default branch).
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      # setup-python gives a pip that isn't the externally-managed Homebrew one.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dmgbuild
        run: pip install dmgbuild

      - name: Package
        run: scripts/package.sh 0.0.0-test.${{ github.run_number }}

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: EasyEQ-test-${{ github.run_number }}
          path: |
            dist/EasyEQ-*.dmg
            dist/EasyEQ-*.zip
          retention-days: 14
          if-no-files-found: error
